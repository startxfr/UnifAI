# Fork-only (fork/fork-only-paths): builds, pushes, signs and attests the five UnifAI application images
# on quay.io, so that a cluster can verify them (zuno-demo ADR-0586, WP-176).
#
# - push to devel (when an image's code changed): quay.io/zuno/unifai-<component>:devel-<sha> and :devel,
#   environment `quay-devel` (no approval, branches devel and release-*);
# - push to a hotfix branch release-X.Y (fork/RELEASING.md): the same, tagged release-X.Y-<sha> and :release-X.Y,
#   signed with this workflow's identity on that branch (checked by cut-release, re-signed by the hotfix release);
# - manual run: from devel or release-X.Y; the `components` input picks the images (empty = all).
#
# Releases do not build here: release.yml (tag vX.Y.Z, fork/RELEASING.md) tags these signed <branch>-<sha> digests
# vX.Y.Z and adds its own release signature.
#
# The operator image (quay.io/zuno/unifai-operator, fork/unifai-operator/Dockerfile) is built the same way, when the
# operator's code or Makefile changed: <branch>-<sha> is the image the canary deploys by digest, and the release
# re-tags that signed digest vX.Y.Z without rebuilding it. The application images are rebuilt only when their code
# changed, the operator image only when its code changed.
#
# Each image is signed KEYLESS by this workflow's GitHub OIDC identity and carries two attestations, a SLSA
# provenance and an SPDX SBOM. The identity zuno accepts for development builds is
#   https://github.com/startxfr/UnifAI/.github/workflows/publish-images.yml@refs/heads/devel
# (releases: release.yml@refs/tags/vX.Y.Z)
# (zuno-demo platform/supply-chain/image-identities.yaml): renaming this file or its triggers changes that
# identity and needs the zuno side to change with it.
#
# Actions are pinned by commit SHA (this job holds an OIDC token that signs): bump them deliberately, with the
# version in the trailing comment. Images pushed by hand (`make images-devel`) are unsigned and are not accepted by a
# cluster that verifies; they must not reuse the devel / devel-<sha> tags this workflow owns.
name: publish-images

on:
  push:
    branches: [devel, "release-*"]
    paths:
      - rag/**
      - multi-agent/**
      - backend/**
      - shared-resources/identity/**
      - ui/**
      - global_utils/**
      - .github/workflows/publish-images.yml
      - fork/ci/**
      - fork/unifai-operator/cmd/**
      - fork/unifai-operator/api/**
      - fork/unifai-operator/internal/**
      - fork/unifai-operator/go.mod
      - fork/unifai-operator/go.sum
      - fork/unifai-operator/Dockerfile
      - fork/unifai-operator/Makefile
  workflow_dispatch:
    inputs:
      components:
        description: "Images to build, comma-separated (rag, multiagent, backend, identity, ui, operator); empty = all"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: quay.io/zuno
  IMAGE_PREFIX: unifai

jobs:
  # Which images this run builds: those whose code has no image yet (application images together, operator image apart);
  # everything, or the `components` input, on a manual run.
  changes:
    if: github.ref == 'refs/heads/devel' || startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select the images to build
        id: select
        env:
          COMPONENTS: ${{ github.event.inputs.components }}
        run: |
          set -euo pipefail
          # A push builds the images whose code at this commit has no <branch>-<sha> image yet
          # (fork/ci/release_images.py --missing, the same content paths a release resolves): comparing with the
          # images, not with the previous push, also builds a change whose own run was cancelled or replaced in the
          # concurrency queue. The workflow file holds every image's build steps: changing it rebuilds them all.
          # A manual run builds everything (or the `components` input).
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            command -v skopeo > /dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
            missing=" $(python3 fork/ci/release_images.py --missing --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" | tr '\n' ' ') "
          else
            missing=" rag multiagent backend identity ui operator "
          fi
          echo "without an image for this code:$missing"
          want() { [[ "$missing" == *" $1 "* ]]; }
          entries=()
          if want rag || want multiagent || want backend || want identity || want ui; then
            # component = quay image suffix (the Makefile's IMAGE_<component> mapping); same Dockerfiles and
            # arguments as the Makefile's build-<component> targets.
            entries+=('{"component":"rag","dockerfile":"rag/Dockerfile","context":".","prepare":"","build_args":""}')
            entries+=('{"component":"multiagent","dockerfile":"multi-agent/Dockerfile","context":".","prepare":"make multiagent-perms","build_args":"--build-arg CERT_URL="}')
            entries+=('{"component":"backend","dockerfile":"backend/Dockerfile","context":".","prepare":"","build_args":""}')
            entries+=('{"component":"identity","dockerfile":"shared-resources/identity/Dockerfile","context":".","prepare":"","build_args":""}')
            entries+=('{"component":"ui","dockerfile":"ui/deployment/Dockerfile","context":".","prepare":"make ui-certs ui-perms","build_args":""}')
          fi
          if want operator; then
            entries+=('{"component":"operator","dockerfile":"fork/unifai-operator/Dockerfile","context":"fork/unifai-operator","prepare":"","build_args":"--build-arg UNIFAI_VERSION=devel"}')
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "${COMPONENTS// /}" ]]; then
            # A manual run may name the images to build.
            known="rag multiagent backend identity ui operator"
            picked=()
            for c in ${COMPONENTS//,/ }; do
              [[ " $known " == *" $c "* ]] || { echo "::error::unknown component '$c' (one of: $known)"; exit 1; }
              for e in "${entries[@]}"; do
                [[ "$e" == *"\"component\":\"$c\""* ]] && picked+=("$e")
              done
            done
            [ "${#picked[@]}" -gt 0 ] || { echo "::error::none of '$COMPONENTS' can be built from $GITHUB_REF"; exit 1; }
            entries=("${picked[@]}")
          fi
          matrix="$(IFS=,; echo "[${entries[*]}]")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "images: $matrix"

  images:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: quay-devel
    permissions:
      contents: read
      id-token: write   # keyless signing with this run's OIDC token
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The multiagent and rag images are large: the stock runner runs out of disk without this.
      - name: Free disk space on the runner
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Work out the image tags
        id: tags
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_PREFIX-$COMPONENT"
          tags="$GITHUB_REF_NAME-$(git rev-parse --short=9 HEAD) $GITHUB_REF_NAME"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Prepare the build context
        if: matrix.prepare != ''
        env:
          PREPARE: ${{ matrix.prepare }}
        run: $PREPARE

      - name: Build
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          BUILD_ARGS: ${{ matrix.build_args }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          first="${TAGS%% *}"
          if [[ "$COMPONENT" == operator ]]; then
            # The operator reports the Makefile VERSION of this commit (status.operatorVersion, upgrade checks).
            version="$(sed -n 's/^VERSION ?= //p' fork/unifai-operator/Makefile)"
            BUILD_ARGS="$BUILD_ARGS --build-arg VERSION=$version"
          fi
          # BUILD_ARGS is deliberately unquoted: it holds zero or more `--build-arg K=V` words from the matrix.
          docker build $BUILD_ARGS -t "$IMAGE:$first" -f "$DOCKERFILE" "$CONTEXT"
          for t in $TAGS; do
            docker tag "$IMAGE:$first" "$IMAGE:$t"
          done

      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          echo "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USERNAME" --password-stdin

      - name: Push and read the digest
        id: push
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for t in $TAGS; do
            docker push "$IMAGE:$t"
          done
          first="${TAGS%% *}"
          ref="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE:$first")"
          case "$ref" in *@sha256:*) ;; *) echo "no digest for $first: $ref" >&2; exit 1;; esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1

      - name: Sign the digest, keyless
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          echo "$QUAY_TOKEN" | cosign login quay.io -u "$QUAY_USERNAME" --password-stdin
          cosign sign --yes "$REF"

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the build provenance
        env:
          REF: ${{ steps.push.outputs.ref }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          python3 fork/ci/slsa_provenance.py --component "$COMPONENT" --out provenance.json
          # Rekor is a public service: retry, and keep cosign's debug output so a
          # rejected entry stays visible instead of "giving up".
          for n in 1 2 3 4 5; do
            cosign attest --yes --verbose --type slsaprovenance1 --predicate provenance.json "$REF" && exit 0
            echo "attest: attempt $n failed" >&2
            sleep $((n * 20))
          done
          exit 1

      # The SBOM of an image is tens of megabytes: far over what the public Rekor log
      # accepts as an attestation (it rejected 25 MB). It is pushed as its own OCI
      # artifact, tagged sha256-<image digest>.sbom, and that artifact is signed with
      # the same keyless identity (a signature entry is a few hundred bytes).
      - name: Publish and sign the SBOM
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          ls -l sbom.spdx.json
          repo="${REF%@*}"
          digest="${REF#*@}"
          tag="${repo}:${digest/:/-}.sbom"
          sbom_ref="$(cosign upload blob -f sbom.spdx.json --ct application/spdx+json "$tag" | tail -n 1)"
          case "$sbom_ref" in
            "$repo"@sha256:*) ;;
            *) echo "unexpected upload output: $sbom_ref" >&2; exit 1 ;;
          esac
          cosign sign --yes "$sbom_ref"
          echo "SBOM artifact: $sbom_ref (tag ${digest/:/-}.sbom)"

      - name: Record the signed reference
        env:
          REF: ${{ steps.push.outputs.ref }}
          COMPONENT: ${{ matrix.component }}
        run: |
          {
            echo "### $COMPONENT"
            echo
            echo '```'
            echo "$REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
