# Fork-only (fork/fork-only-paths): publishes a release vX.Y.Z of the fork (fork/RELEASING.md). Started by the tag
# that cut-release.yml pushes (only the release bot may create v* tags: ruleset `release-tags`).
#
# Nothing is rebuilt. The six images (operator, rag, multiagent, backend, identity, ui) are the signed devel-<sha>
# builds named in the tag message, checked again here; each digest is tagged vX.Y.Z and signed with THIS workflow's
# identity, which is what a release cluster accepts:
#   https://github.com/startxfr/UnifAI/.github/workflows/release.yml@refs/tags/vX.Y.Z
# The operator bundle (alpha channel only) and the catalog are built here, signed the same way, and listed with the
# images in release.json, attached to the GitHub release for zuno-demo's pin script.
#
# Environments: kind `weekly` → quay-weekly (no approval), `manual` → quay-release (approval), `rc` → quay-test (a
# rehearsal into quay.io/zuno/test-unifai-*, pre-release, no commit back). After a weekly or manual release, the bot
# commits the release files and the next patch VERSION to devel.
#
# Actions are pinned by commit SHA (the publish job holds an OIDC token that signs).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      base: ${{ steps.plan.outputs.base }}
      environment: ${{ steps.plan.outputs.environment }}
      prefix: ${{ steps.plan.outputs.prefix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Read and check the tag
        id: plan
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          git fetch --force origin "+refs/tags/$tag:refs/tags/$tag" "+refs/heads/stable:refs/remotes/origin/stable"
          [ "$(git cat-file -t "refs/tags/$tag")" = tag ] || { echo "::error::$tag is not an annotated tag"; exit 1; }
          tagger="$(git for-each-ref "refs/tags/$tag" --format='%(taggername)')"
          [ "$tagger" = "unifai-release-bot[bot]" ] || { echo "::error::$tag was not cut by the release bot ($tagger)"; exit 1; }
          git for-each-ref "refs/tags/$tag" --format='%(contents)' > "$RUNNER_TEMP/message"
          kind="$(sed -n '1s/^kind: //p' "$RUNNER_TEMP/message")"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]] || { echo "::error::$tag is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          base="${BASH_REMATCH[1]}"
          rc="${BASH_REMATCH[2]}"
          case "$kind" in
            weekly) env=quay-weekly prefix=unifai ;;
            manual) env=quay-release prefix=unifai ;;
            rc) env=quay-test prefix=test-unifai ;;
            *) echo "::error::unknown kind '$kind' in the message of $tag"; exit 1 ;;
          esac
          [[ ( "$kind" = rc && -n "$rc" ) || ( "$kind" != rc && -z "$rc" ) ]] || { echo "::error::kind $kind does not match $tag"; exit 1; }
          grep -qx "VERSION ?= $base" fork/unifai-operator/Makefile || { echo "::error::the Makefile VERSION of $tag is not $base"; exit 1; }
          if [ "$kind" != rc ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/stable || { echo "::error::$tag is not on stable"; exit 1; }
          fi
          {
            echo "kind=$kind"
            echo "version=${tag#v}"
            echo "base=$base"
            echo "environment=$env"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"
          echo "### $tag: $kind release, environment $env, repositories quay.io/zuno/$prefix-*" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # keyless signing with this run's OIDC token
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BASE: ${{ needs.plan.outputs.base }}
      PREFIX: ${{ needs.plan.outputs.prefix }}
      KIND: ${{ needs.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: fork/unifai-operator/go.mod

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1

      # The tag message names the digests that were cut; they must still be the signed builds of this commit's code.
      - name: The six images of the tag
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '1,2d' > "$RUNNER_TEMP/cut.json"
          python3 fork/ci/release_images.py --version "$BASE" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/images.json" > /dev/null
          python3 - "$RUNNER_TEMP/cut.json" "$RUNNER_TEMP/images.json" <<'EOF'
          import json, sys
          cut, now = (json.load(open(p))["images"] for p in sys.argv[1:3])
          if {c: v["ref"] for c, v in cut.items()} != {c: v["ref"] for c, v in now.items()}:
              sys.exit(f"the tag message names {cut}, the commit resolves to {now}")
          EOF

      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: echo "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USERNAME" --password-stdin

      # The same digests, so the devel signatures, provenance and SBOM artifacts still describe them; the release
      # identity is added on top. A rehearsal copies them (and their SBOM artifact) into the test repositories.
      - name: Tag and sign the six images v${{ env.VERSION }}
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          echo '{}' > "$RUNNER_TEMP/released.json"
          for c in operator rag multiagent backend identity ui; do
            src="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"][sys.argv[2]]["ref"])' "$RUNNER_TEMP/images.json" "$c")"
            digest="${src#*@}"
            repo="quay.io/zuno/$PREFIX-$c"
            skopeo copy --preserve-digests --dest-creds "$QUAY_USERNAME:$QUAY_TOKEN" "docker://$src" "docker://$repo:v$VERSION"
            got="$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://$repo:v$VERSION")"
            [ "$got" = "$digest" ] || { echo "::error::$repo:v$VERSION is $got, not $digest"; exit 1; }
            sbom="${digest/:/-}.sbom"
            if [ "${src%@*}" != "$repo" ]; then
              skopeo copy --preserve-digests --dest-creds "$QUAY_USERNAME:$QUAY_TOKEN" "docker://${src%@*}:$sbom" "docker://$repo:$sbom"
            fi
            bash fork/ci/sign_and_attest.sh "$repo@$digest" "$c"
            python3 - "$RUNNER_TEMP/released.json" "$c" "$repo@$digest" <<'EOF'
          import json, sys
          path, c, ref = sys.argv[1:4]
          d = json.load(open(path)); d[c] = ref; json.dump(d, open(path, "w"))
          EOF
            echo "- $c: $repo@$digest" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Bundle v${{ env.VERSION }} on the alpha channel
        working-directory: fork/unifai-operator
        run: |
          set -euo pipefail
          operator="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["operator"])' "$RUNNER_TEMP/released.json")"
          base="quay.io/zuno/$PREFIX-operator"
          make bundle IMG="$operator" VERSION="$VERSION" IMAGE_TAG_BASE="$base" CHANNELS=alpha
          make bundle-build bundle-push VERSION="$VERSION" IMAGE_TAG_BASE="$base" CONTAINER_TOOL=docker
          echo "BUNDLE_REF=$base-bundle@$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://$base-bundle:v$VERSION")" >> "$GITHUB_ENV"

      - name: SBOM of the bundle
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.BUNDLE_REF }}
          format: spdx-json
          output-file: sbom-bundle.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the bundle
        run: bash fork/ci/sign_and_attest.sh "$BUNDLE_REF" operator-bundle "$GITHUB_WORKSPACE/sbom-bundle.spdx.json"

      # Rendering the catalog reads the bundle images from the registry: only once the bundle is pushed.
      - name: Catalog with v${{ env.VERSION }}
        working-directory: fork/unifai-operator
        run: |
          set -euo pipefail
          base="quay.io/zuno/$PREFIX-operator"
          make catalog-add VERSION="$VERSION" IMAGE_TAG_BASE="$base" CHANNELS=alpha
          make catalog-build catalog-push VERSION="$VERSION" IMAGE_TAG_BASE="$base" CONTAINER_TOOL=docker
          echo "CATALOG_REF=$base-catalog@$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://$base-catalog:v$VERSION")" >> "$GITHUB_ENV"

      - name: SBOM of the catalog
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.CATALOG_REF }}
          format: spdx-json
          output-file: sbom-catalog.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the catalog
        run: bash fork/ci/sign_and_attest.sh "$CATALOG_REF" operator-catalog "$GITHUB_WORKSPACE/sbom-catalog.spdx.json"

      - name: release.json and the release files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 - "$RUNNER_TEMP/released.json" "$RUNNER_TEMP/images.json" > "$RUNNER_TEMP/out/release.json" <<'EOF'
          import json, os, sys
          released, resolved = (json.load(open(p)) for p in sys.argv[1:3])
          tag = os.environ["GITHUB_REF_NAME"]
          print(json.dumps({
              "version": os.environ["VERSION"],
              "kind": os.environ["KIND"],
              "commit": os.environ["GITHUB_SHA"],
              "signer": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/.github/workflows/release.yml@refs/tags/{tag}",
              "issuer": "https://token.actions.githubusercontent.com",
              "images": {c: {"ref": ref, "source": resolved["images"][c]["tag"]} for c, ref in released.items()},
              "bundle": os.environ["BUNDLE_REF"],
              "catalog": os.environ["CATALOG_REF"],
              "channel": "alpha",
          }, indent=2))
          EOF
          # What the release changed in the tree (bundle, catalog template and rendering, manager image): the
          # post-release job commits it to devel.
          git add -A fork/unifai-operator
          git diff --cached --binary > "$RUNNER_TEMP/out/release-files.patch"
          python3 fork/ci/release_notes.py "$VERSION" "$GITHUB_SHA" --images "$RUNNER_TEMP/out/release.json" > "$RUNNER_TEMP/out/notes.md"
          cat "$RUNNER_TEMP/out/release.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.VERSION }}
          path: ${{ runner.temp }}/out/

      - name: Log out
        if: always()
        run: docker logout quay.io

  github-release:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: out
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.plan.outputs.kind }}
        run: |
          set -euo pipefail
          pre=""
          [ "$KIND" = rc ] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "UnifAI ${GITHUB_REF_NAME#v}" --notes-file out/notes.md out/release.json

  post-release:
    needs: [plan, publish]
    if: needs.plan.outputs.kind != 'rc'
    runs-on: ubuntu-latest
    environment: release-bot
    timeout-minutes: 15
    steps:
      - name: Release bot token
        id: bot
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: devel
          token: ${{ steps.bot.outputs.token }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/out

      # The release files of vX.Y.Z and the next patch VERSION, on top of whatever devel has gained meanwhile.
      - name: Commit the release files and the next VERSION to devel
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "unifai-release-bot[bot]"
          git config user.email "unifai-release-bot[bot]@users.noreply.github.com"
          IFS=. read -r major minor patch <<< "$VERSION"
          next="$major.$minor.$((patch + 1))"
          for attempt in 1 2 3; do
            git fetch origin devel && git reset -q --hard origin/devel
            git apply --3way "$RUNNER_TEMP/out/release-files.patch"
            # Only when nobody moved VERSION on already.
            sed -i "s/^VERSION ?= $VERSION$/VERSION ?= $next/" fork/unifai-operator/Makefile
            git add -A fork/unifai-operator
            git commit -q -m "release(fork): v$VERSION published, next VERSION $next" \
              -m "Release files of v$VERSION (bundle, catalog on alpha) committed by the release workflow."
            git push origin HEAD:devel && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::could not push the post-release commit to devel"
          exit 1
