# Fork-only (fork/fork-only-paths): tests that need no cluster, on every change to the code they cover.
# - outbound-guard: the platform's MCP and A2A clients against real local servers through the guarded transport
#   (redirects, address pinning, rebinding), which the cluster e2e has no MCP/A2A fixture for;
# - fork-ci: the signing and provenance scripts of the image and release workflows;
# - unit: the unit tests of multi-agent, rag and identity, minus the tests that already fail on upstream main
#   (fork/ci/unit-test-debt.txt). This workflow gates the weekly release (fork/ci/release_gate.py): a red run skips it.
name: fork-tests

on:
  push:
    branches: [devel]
    paths:
      - multi-agent/**
      - rag/**
      - shared-resources/identity/**
      - global_utils/**
      - fork/ci/**
      - .github/workflows/fork-tests.yml
  pull_request:
    branches: [devel]
    paths:
      - multi-agent/**
      - rag/**
      - shared-resources/identity/**
      - global_utils/**
      - fork/ci/**
      - .github/workflows/fork-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  outbound-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            multi-agent/pyproject.toml
            global_utils/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./multi-agent[all]" -e "./global_utils[multi-agent]" pytest
      - name: Guarded MCP and A2A clients against real servers
        working-directory: multi-agent
        env:
          PYTHONPATH: lib:adapters:../global_utils/src:.
        run: python -m pytest -q tests/integration/external_servers
      - name: Outbound guard unit tests
        working-directory: global_utils
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests

  fork-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - name: Signing and provenance scripts
        run: python -m pytest -q fork/ci

  unit:
    name: unit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: multi-agent
            install: '-e "./multi-agent[all]" -e "./global_utils[multi-agent]" -r multi-agent/requirements-test.txt'
          - suite: rag
            install: '-e ./rag -e "./global_utils[rag]" pytest pytest-timeout'
          - suite: shared-resources/identity
            install: '-e "./shared-resources/identity[dev]" -e "./global_utils[identity]"'
            secret_key: unit-tests-only  # identity's app refuses to start without one; an empty value counts as unset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.suite }}/pyproject.toml
            global_utils/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.install }}
      - name: Unit tests minus the upstream debt
        env:
          SECRET_KEY: ${{ matrix.secret_key }}
        run: python fork/ci/run_unit_tests.py ${{ matrix.suite }}
