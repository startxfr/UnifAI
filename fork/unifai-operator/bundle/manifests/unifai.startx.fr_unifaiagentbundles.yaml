apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: unifaiagentbundles.unifai.startx.fr
spec:
  group: unifai.startx.fr
  names:
    categories:
    - unifai
    kind: UnifaiAgentBundle
    listKind: UnifaiAgentBundleList
    plural: unifaiagentbundles
    shortNames:
    - uab
    singular: unifaiagentbundle
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.agent
      name: Agent
      type: string
    - jsonPath: .status.verified
      name: Verified
      type: boolean
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UnifaiAgentBundle turns a signed OKF agent bundle (format specified by github.com/startxfr/zuno-demo-agents) into
          UnifAI LLMs, agents, a condition and workflows.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UnifaiAgentBundleSpec maps one signed OKF agent bundle onto
              UnifAI objects.
            properties:
              agentConfig:
                description: |-
                  Extra custom_agent_node settings merged under every emitted agent (e.g. hitl_mode). max_rounds here is the
                  default round bound (15 when unset); a bundle's zuno.limits.max_steps replaces it, within ceilings.maxSteps.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              ceilings:
                description: |-
                  BundleCeilings bound what a bundle may declare (ADR-0564 clause 3): a bundle can narrow, never widen.
                  They are reviewed in Git with the CR, independently of the bundle content.
                properties:
                  delegationTargets:
                    description: A2A targets the bundle may delegate to, as <agent>/<task>
                      (zuno.delegation.targets). Empty = none.
                    items:
                      pattern: ^[a-z][a-z0-9-]*/[a-z][a-z0-9-]*$
                      type: string
                    maxItems: 64
                    type: array
                  knowledgeDomains:
                    description: Knowledge domains the bundle's tasks may declare
                      in allowed_knowledge.
                    items:
                      type: string
                    type: array
                  maxSteps:
                    description: |-
                      Most reasoning/tool rounds a task may declare (zuno.limits.max_steps); unset = 50. A bundle declaring more is
                      refused (WithinCeilings=False).
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  maxTokensPerTurn:
                    description: |-
                      Most tokens one user turn of a task may use over all its model calls (zuno.limits.max_tokens_per_turn). A task
                      declaring more is refused (WithinCeilings=False); a task declaring none gets this value. Unset = no ceiling.
                    format: int32
                    minimum: 1
                    type: integer
                  minClassification:
                    description: |-
                      The least restrictive classification the bundle may run at (C1 < C2 < C3): a bundle declaring a lower
                      level than this would allow model classes the CR's reviewers did not accept.
                    enum:
                    - C1
                    - C2
                    - C3
                    type: string
                  toolCapabilities:
                    description: Tool names the bundle's tasks may declare in allowed_tools.
                    items:
                      type: string
                    type: array
                required:
                - minClassification
                type: object
              classificationOverrides:
                additionalProperties:
                  type: string
                description: 'Per-task classification override: C1, C2 or C3. It may
                  only raise the bundle''s level (ADR-0565).'
                maxProperties: 256
                type: object
                x-kubernetes-validations:
                - message: classification overrides are C1, C2 or C3
                  rule: self.all(k, self[k] in ['C1', 'C2', 'C3'])
              contractNamespace:
                description: |-
                  Namespace of the contract headers the emitted LLMs, MCP providers and A2A nodes send to the gateways
                  behind them: X-<Namespace>-Agent, -Task, -Data-Classification, -Run-Id, -Max-Tokens, -Delegated-By and
                  -Delegation-Depth (e.g. zuno sends X-Zuno-Agent). Unset = both unifai and zuno until 0.2, unifai only from 0.2.
                maxLength: 30
                pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
                type: string
              delegation:
                description: |-
                  Delegation over A2A through an A2A gateway. Unset = a bundle declaring zuno.delegation.targets is refused
                  (DelegationUnsupported).
                properties:
                  approval:
                    description: |-
                      What the A2A node does when a target asks for an approval before a write (input-required, zuno.approval; R-535):
                      ask relays it to the human of the session, whatever the session's auto-approve rules say; dynamic does so only
                      when the session has human approval enabled; skip rejects it, so the write does not run. Unset behaves as skip
                      and leaves the emitted node unchanged.
                    enum:
                    - skip
                    - ask
                    - dynamic
                    type: string
                  gatewayURL:
                    description: Base URL of the A2A gateway; a target agent is called
                      at <gatewayURL>/agents/<agent>.
                    pattern: ^https?://[^/?#@]+$
                    type: string
                  maxApprovals:
                    description: |-
                      How many approval requests of the target agents the whole session may relay, whatever their outcome and across
                      delegations (R-538). Past it the request is refused without asking the human and the remote task is cancelled.
                      Unset leaves the emitted node unchanged and the node applies its own default of 3.
                    format: int32
                    minimum: 1
                    type: integer
                  maxRounds:
                    default: 5
                    description: Rounds of a delegating task's orchestrator (each
                      target is called at most once per turn).
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    description: |-
                      Seconds the A2A node waits for a target's answer; past it the remote task is cancelled (ADR-0406). Set, the
                      message is sent without blocking and polled until then. Unset: the server holds the request until the task is
                      done (the engine's fixed read timeout).
                    format: int32
                    maximum: 900
                    minimum: 1
                    type: integer
                required:
                - gatewayURL
                type: object
              entitlement:
                default: Enforced
                description: |-
                  How zuno.access.groups is honoured. Enforced (default) refuses a bundle declaring groups while UnifAI
                  cannot gate agent visibility by group; GatewayOnly emits it and relies on the gateways checking the
                  caller's JWT groups (ADR-0562 interim; a cutover gate for production).
                enum:
                - Enforced
                - GatewayOnly
                type: string
              groupTeam:
                description: |-
                  GroupTeam emits an owned UnifaiTeam named agent-<bundle> whose members are the bundle's
                  zuno.access.groups (type group) and puts every emitted object in its workspace, so UnifAI's own
                  visibility restricts the agent to those groups. It satisfies the Enforced entitlement. Exclusive with
                  teamId and teamRef; the bundle must declare access groups.
                type: boolean
              llm:
                description: |-
                  BundleLLM is the template of the LLM emitted for every task: the bundle adds the contract headers X-<Namespace>-Agent,
                  -Task, -Data-Classification (effective) and -Run-Id (see contractNamespace) to `config.default_headers`.
                properties:
                  config:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  maxTokens:
                    description: |-
                      Generation ceiling, in tokens per model call, of every task that declares none (zuno.limits.max_tokens). It is
                      sent as the X-<Namespace>-Max-Tokens header (for the model gateway to enforce) and as the client's max_tokens. A
                      task's own limit wins. Unset = the client default and no header.
                    format: int32
                    maximum: 8192
                    minimum: 1
                    type: integer
                  secretRefs:
                    items:
                      description: SecretRef injects a Secret value at a dotted path
                        of the UnifAI config.
                      properties:
                        path:
                          description: Dotted path in the config, e.g. `api_key` or
                            `headers.token`.
                          type: string
                        secretKeyRef:
                          description: SecretKeySelector selects a key of a Secret
                            in the CR's namespace.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - path
                      - secretKeyRef
                      type: object
                    type: array
                  type:
                    default: openai_compatible
                    enum:
                    - openai_compatible
                    type: string
                type: object
              mcp:
                description: |-
                  MCP provider emitted per task that declares allowed_tools, carrying the contract headers. It is attached
                  before `providers`.
                properties:
                  config:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  secretRefs:
                    items:
                      description: SecretRef injects a Secret value at a dotted path
                        of the UnifAI config.
                      properties:
                        path:
                          description: Dotted path in the config, e.g. `api_key` or
                            `headers.token`.
                          type: string
                        secretKeyRef:
                          description: SecretKeySelector selects a key of a Secret
                            in the CR's namespace.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - path
                      - secretKeyRef
                      type: object
                    type: array
                type: object
              owner:
                default: admin
                description: UnifAI user owning the object (workspace identity).
                type: string
              providers:
                description: |-
                  UnifaiProvider names (MCP servers) attached to the tasks that declare allowed_tools, shared by all
                  tasks and sent without the contract headers.
                items:
                  maxLength: 253
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-validations:
                - message: providers are UnifaiProvider names (lower-case DNS labels)
                  rule: self.all(p, p.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'))
              retrieveFirst:
                description: |-
                  RetrieveFirst makes every retriever-backed task agent search the retriever with the user's message
                  before the model reasons (the OKF graph shape retrieve_reason_respond always retrieves first). It sends
                  retrieve_first in the agent config, which only multiagent images that know that option accept: leave it
                  off for older stacks.
                type: boolean
              retriever:
                description: UnifaiRetriever name attached to the tasks that declare
                  allowed_knowledge.
                type: string
                x-kubernetes-validations:
                - message: retriever is an UnifaiRetriever name (lower-case DNS label)
                  rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
              servePlaceholder:
                description: |-
                  ServePlaceholder serves a bundle whose OKF says zuno.status: placeholder (ADR-0007). By default such a
                  bundle stays Pending, "placeholder agent: not served", and no object is emitted (objects it emitted
                  before are removed).
                type: boolean
              source:
                description: BundleSource says where the bundle comes from.
                properties:
                  oci:
                    description: OCIBundleSource pins a signed OKF bundle in an OCI
                      registry.
                    properties:
                      pullSecretRef:
                        description: kubernetes.io/dockerconfigjson Secret for a private
                          repository (anonymous pull when unset).
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      reference:
                        description: Reference pinned by digest, e.g. registry.example.com/agents/okf-myagent@sha256:<64
                          hex>. Tags are refused.
                        type: string
                        x-kubernetes-validations:
                        - message: reference must be pinned by a sha256 digest
                          rule: self.matches('^[^@]+@sha256:[a-f0-9]{64}$')
                    required:
                    - reference
                    type: object
                required:
                - oci
                type: object
              teamId:
                description: Team workspace to use instead of the user's personal
                  one.
                type: string
              teamRef:
                description: |-
                  UnifaiTeam (same namespace) whose team workspace to use; the object waits until the team is Ready.
                  Exclusive with teamId.
                type: string
              unifaiName:
                description: Name in UnifAI (defaults to metadata.name).
                type: string
              verify:
                description: 'BundleVerify says how the bundle signature is checked:
                  with a public key, or keyless (ADR-0578). Exactly one.'
                properties:
                  keyless:
                    description: Keyless cosign signature of the artifact manifest
                      digest, checked offline against a Sigstore trusted root.
                    properties:
                      issuer:
                        description: OIDC issuer of the signing certificate, e.g.
                          https://token.actions.githubusercontent.com.
                        minLength: 1
                        type: string
                      subjectRegExp:
                        description: Regular expression the certificate subject (the
                          workflow identity) must match; anchor it.
                        minLength: 1
                        type: string
                      trustedRootRef:
                        description: Sigstore trusted_root.json (Fulcio, Rekor and
                          CT log keys), in a Secret of the bundle's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - issuer
                    - subjectRegExp
                    - trustedRootRef
                    type: object
                  publicKeyRef:
                    description: |-
                      PEM public half of the signing key (e.g. a KMS or Vault Transit key exported once): the operator needs no access
                      to the key store. Checks the bundle content digest.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of publicKeyRef or keyless
                  rule: has(self.publicKeyRef) != has(self.keyless)
            required:
            - ceilings
            - llm
            - source
            - verify
            type: object
            x-kubernetes-validations:
            - message: teamId and teamRef are exclusive
              rule: '!has(self.teamId) || !has(self.teamRef) || size(self.teamId)
                == 0 || size(self.teamRef) == 0'
            - message: groupTeam is exclusive with teamId and teamRef
              rule: '!has(self.groupTeam) || !self.groupTeam || ((!has(self.teamId)
                || size(self.teamId) == 0) && (!has(self.teamRef) || size(self.teamRef)
                == 0))'
          status:
            description: UnifaiAgentBundleStatus reports verification and the emitted
              objects.
            properties:
              agent:
                description: zuno.name of the bundle.
                type: string
              bundleDigest:
                description: OKF content digest that the signature covers.
                type: string
              children:
                description: Emitted objects, as <Kind>/<name>.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              display:
                description: Display is the public sheet built from the admitted bundle
                  (never from a field set by hand).
                properties:
                  agent:
                    description: Agent is the agent's stable name, the key of its
                      entry (/agents/<agent>).
                    type: string
                  classification:
                    description: Classification ceiling.
                    type: string
                  color:
                    description: 'A CSS color keyword or #rrggbb.'
                    type: string
                  description:
                    type: string
                  displayName:
                    type: string
                  icon:
                    description: Short keyword for an icon, lower case letters, digits
                      and hyphens.
                    type: string
                  maintainer:
                    type: string
                  state:
                    description: Lifecycle state, such as active or placeholder.
                    type: string
                  tasks:
                    items:
                      description: DisplayTask is the public name of one task.
                      properties:
                        name:
                          type: string
                        title:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  tileDescription:
                    type: string
                  title:
                    type: string
                type: object
              lastReconciled:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              okfVersion:
                description: okf_version of the bundle.
                type: string
              phase:
                description: Ready, Error, Pending.
                type: string
              primaryTask:
                description: zuno.primary_task of the bundle (the task an A2A call
                  reaches when it names none).
                type: string
              resolvedDigest:
                description: Manifest digest that was pulled.
                type: string
              signer:
                description: Certificate subject that signed the artifact (keyless
                  verification only).
                type: string
              tasks:
                items:
                  description: BundleTaskStatus is what was emitted for one task.
                  properties:
                    classification:
                      type: string
                    name:
                      type: string
                    workflow:
                      type: string
                  required:
                  - classification
                  - name
                  - workflow
                  type: object
                type: array
              unmapped:
                description: OKF content with no UnifAI equivalent.
                items:
                  type: string
                type: array
              verified:
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
