# unifai-devel on demo333: the helmfile deployment taken over by the operator (existing volumes and keys are kept).
# Identity on the zuno Keycloak realm, groups read from the token (oidc-claims); ai-ops-01 is the UnifAI admin.
# Live, the images are also pinned by digest (spec.images); the demo objects come from
# examples/overlays/unifai-devel-demo333.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiStack
metadata:
  name: unifai
  namespace: unifai-devel
spec:
  profile: dev
  # Immutable tag of the UnifAI images (fork devel).
  version: devel-9c13a282b
  imageRegistry: quay.io/zuno
  identity:
    adminUsers: [ai-ops-01]
    external:
      url: https://keycloak.apps.demo333.startx.fr
      realm: zuno
      clientId: unifai
      clientSecret: {name: unifai-oidc, key: client-secret}
  extraEnv:
    identity:
      - {name: DIRECTORY_PROVIDER, value: oidc-claims}
      - {name: DIRECTORY_OIDC_JWKS_URL, value: https://keycloak.apps.demo333.startx.fr/realms/zuno/protocol/openid-connect/certs}
      - {name: DIRECTORY_OIDC_ISSUER, value: https://keycloak.apps.demo333.startx.fr/realms/zuno}
    # The demo MCP server and mock LLM are in-namespace Services: allow them past the multiagent SSRF guard.
    multiagent:
      - {name: OUTBOUND_ALLOWED_HOSTS, value: "unifai-demo-mcp,unifai-demo-llm"}
    multiagentWorker:
      - {name: OUTBOUND_ALLOWED_HOSTS, value: "unifai-demo-mcp,unifai-demo-llm"}
  exposure:
    networkPolicy: true
  rag:
    docling: {mode: deploy}
    embedding: {mode: deploy, model: sentence-transformers/all-MiniLM-L6-v2, dimension: 384}
  storage:
    className: gp3-csi
    sharedClassName: nfs
  deletionPolicy: Retain
