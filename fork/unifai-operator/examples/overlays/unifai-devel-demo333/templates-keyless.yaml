# The two catalog templates without placeholders: the mock LLM (constant answer) and the demo MCP server, both in the
# namespace. "Configure & Generate" gives a workflow that runs at once.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiTemplate
metadata: {name: demo-chat-quickstart}
spec:
  draft:
    description: One agent on the in-namespace mock LLM. No API key needed.
    llms:
      - rid: llm_rid
        name: mock
        type: openai_compatible
        config: {type: openai_compatible, model_name: mock-model, base_url: "http://unifai-demo-llm:8000/v1", api_key: EMPTY}
  placeholders: {categories: []}
---
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiTemplate
metadata: {name: demo-ops-triage}
spec:
  draft:
    description: An agent with the demo MCP server (utc_now, echo) on the mock LLM. No key, no cluster token.
    providers:
      - rid: mcp_rid
        name: Demo MCP
        type: mcp_server
        config: {type: mcp_server, mcp_url: "http://unifai-demo-mcp:8004/sse", transport_type: sse, auth_method: access_token, tool_names: [utc_now, echo]}
    llms:
      - rid: llm_rid
        name: mock
        type: openai_compatible
        config: {type: openai_compatible, model_name: mock-model, base_url: "http://unifai-demo-llm:8000/v1", api_key: EMPTY}
    tools: []
    nodes:
      - {rid: user_question, name: User Question Node, type: user_question_node, config: {type: user_question_node, retries: 1}}
      - {rid: final_answer, name: Final Answer Node, type: final_answer_node, config: {type: final_answer_node, retries: 1}}
      - rid: sre_rid
        name: SRE Agent
        type: custom_agent_node
        config: {type: custom_agent_node, llm: llm_rid, providers: [mcp_rid], system_message: Triage the incident., hitl_mode: skip}
  placeholders: {categories: []}
