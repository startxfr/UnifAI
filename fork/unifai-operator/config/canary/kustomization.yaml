# Canary instance of the operator, deployed next to the OLM one to test a release candidate (make canary-deploy).
# It only reconciles UnifAI objects labelled unifai.startx.fr/operator-instance=canary; the OLM instance ignores
# them. CRDs are not part of this overlay (make canary-deploy applies them first).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unifai-operator-canary
namePrefix: unifai-operator-canary-
resources:
- ../rbac
- ../manager
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: OPERATOR_INSTANCE, value: canary}
  target:
    kind: Deployment
    name: controller-manager
# Matched by its full name: config/manager already rewrote the `controller` placeholder to the last release.
images:
- digest: sha256:48a4dd6282b5651f86926da68722ea41b80ca93464ae81ef0304f17ab500233e
  name: quay.io/zuno/unifai-operator
  newName: quay.io/zuno/unifai-operator
